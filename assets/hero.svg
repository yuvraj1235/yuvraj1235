<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#0f1a38" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.3" fill="#7f8fb8"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2b4fd8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2b4fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <mask id="dotmask"><rect x="600" y="40" width="200" height="200" fill="url(#fade)"/></mask>
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes blink { 50% { opacity: 0; } }
      .ring { transform-origin: 700px 150px; animation: spin 40s linear infinite; }
      .cur { animation: blink 1.2s step-end infinite; }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="#050810"/>
  <rect width="900" height="300" rx="14" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="none" stroke="#14244f"/>

  <!-- right-side HUD -->
  <circle cx="700" cy="150" r="130" fill="url(#glow)"/>
  <rect x="600" y="40" width="200" height="200" fill="url(#dots)" mask="url(#dotmask)"/>
  <circle cx="700" cy="150" r="118" fill="none" stroke="#1d3270" stroke-width="1"/>
  <circle class="ring" cx="700" cy="150" r="104" fill="none" stroke="#3a5bd0" stroke-width="1.2" stroke-dasharray="6 14"/>
  <text x="700" y="156" text-anchor="middle" font-size="40" fill="#8fa8ff" font-weight="700">&lt;/&gt;</text>

  <!-- header -->
  <text x="32" y="38" font-size="10" fill="#6b7aa8" letter-spacing="3">GITSKINS / LIVING IDENTITY</text>
  <text x="868" y="38" font-size="10" fill="#6b7aa8" text-anchor="end">@YOUR_GITHUB_USERNAME</text>

  <!-- name -->
  <text x="32" y="92" font-size="11" fill="#3f6df0" letter-spacing="4">HELLO, WORLD. I'M</text>
  <text x="32" y="160" font-size="68" fill="#e6ebff" font-weight="700">Yuvraj<tspan class="cur" fill="#3f6df0">_</tspan></text>
  <text x="32" y="192" font-size="14" fill="#e6ebff">Embedded ML  /  Firmware  /  Open Source</text>
  <text x="32" y="212" font-size="11" fill="#6b7aa8">B.Tech CSE · NIT Durgapur, India</text>

  <!-- bottom row -->
  <line x1="32" y1="238" x2="868" y2="238" stroke="#14244f"/>
  <g font-size="9" fill="#6b7aa8" letter-spacing="2">
    <text x="32" y="260">FIRMWARE</text>
    <text x="232" y="260">ML</text>
    <text x="432" y="260">COMMUNITY</text>
    <text x="632" y="260">CONTRIBUTING TO</text>
  </g>
  <g font-size="16" fill="#e6ebff">
    <text x="32" y="283">ESP-IDF · LVGL</text>
    <text x="232" y="283">VLM · RAG</text>
    <text x="432" y="283">GLUG NITD</text>
    <text x="632" y="283">Excalidraw</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
